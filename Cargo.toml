[package]
name = "faces_network_common_types"
version = "0.1.0"
edition = "2024"

[features]

default = []
client-side = ["faces_quic_client"]
server-side = []

[dependencies]
serde = {version = "1.0.226", features = ["derive"]}
serde_json = "1.0.145"
faces_quic_client = { git = "https://github.com/Cm3lp8/faces-quic-client.git", rev = "5225dd8000adbcda8991ea73f78c3999558ac45c", optional = true }
faces_quic_server = { git = "https://github.com/Cm3lp8/faces_http3_server.git", rev = "6d14bea65df8adcdd5d95d85a6d86e92b4b613eb" }
uuid = {version = "1.18.1", features = ["v4", "v7", "serde"]}
chrono = {version="0.4.42", features=["serde"]}
bincode = { version="2.0.1", features=["serde", "derive"]}
postgres-types = { version = "0.2.11", features =["derive"]}
bytes = "1.11.0"
